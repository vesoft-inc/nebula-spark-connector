name: snapshot

on:
  push:
    branches: [dev]

defaults:
  run:
    shell: bash


jobs:
  deploy-spark-connector-snapshot:
    runs-on: [self-hosted, linux]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.2

#      - name: Deploy nebula-connector_spark2.4  to SNAPSHOT
#        uses: samuelmeuli/action-maven-publish@v1
#        with:
#          gpg_private_key: ${{ secrets.JAVA_GPG_PRIVATE_KEY }}
#          gpg_passphrase: ""
#          nexus_username: ${{ secrets.OSSRH_USERNAME }}
#          nexus_password: ${{ secrets.OSSRH_TOKEN }}
#          maven_goals_phases: "clean deploy -Dmaven.javadoc.skip=true -pl spark2.4 -am -Pscala-2.11"
#
#
#      - name: Deploy nebula-connector_spark3 to SNAPSHOT
#        uses: samuelmeuli/action-maven-publish@v1
#        with:
#          gpg_private_key: ${{ secrets.JAVA_GPG_PRIVATE_KEY }}
#          gpg_passphrase: ""
#          nexus_username: ${{ secrets.OSSRH_USERNAME }}
#          nexus_password: ${{ secrets.OSSRH_TOKEN }}
#          maven_goals_phases: "clean deploy -Dmaven.javadoc.skip=true -pl spark3 -am -Pscala-2.12 "

      - name: setup minio
        uses: vesoft-inc/.github/actions/setup-minio@master
        with:
          minio_url: ${{ secrets.MINIO_ENDPOINT }}
          access_key: ${{ secrets.MINIO_KEY }}
          secret_key: ${{ secrets.MINIO_SECRET }}


      - name: package assembly for spark3
        run: |
          mvn clean install -Dmaven.javadoc.skip=true -Dmaven.test.skip=true -pl assembly -am -Pscala-2.12 -Pspark3

      - name: Copy nebula-connector for spark3 to snapshot on MinIO
        run: |
          mv target/ nebula-graph-sparkconnector/
          tar czf ./nebula-graph-sparkconnector_spark3-5.1-SNAPSHOT.tgz nebula-graph-sparkconnector/nebula-connector_spark3-assembly-5.1-SNAPSHOT.jar
          mc cp nebula-graph-sparkconnector_spark3-5.1-SNAPSHOT.tgz minio/nightly-build/nebula-ng-spark-connector/5.1-SNAPSHOT/
        working-directory: assembly


      - name: package assembly for spark2.4
        run: |
          mvn clean install -Dmaven.javadoc.skip=true -Dmaven.test.skip=true -pl assembly -am -Pscala-2.11 -Pspark2.4

      - name: Copy nebula-connector for spark2.4 to snapshot on MinIO
        run: |
          mv nebula-graph-sparkconnector nebula-graph-sparkconnector3
          mv target/ nebula-graph-sparkconnector/
          tar czf ./nebula-graph-sparkconnector_spark2.4-5.1-SNAPSHOT.tgz nebula-graph-sparkconnector/nebula-connector_spark2.4-assembly-5.1-SNAPSHOT.jar
          mc cp nebula-graph-sparkconnector_spark2.4-5.1-SNAPSHOT.tgz minio/nightly-build/nebula-ng-spark-connector/5.1-SNAPSHOT/
        working-directory: assembly
