# This is temporary action for clients test.

name: pull_request
on:
  push:
    branches: [ dev, "release-**" ]
  pull_request:
    branches: [ dev, "release-**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  connector-spark:
    runs-on: [ self-hosted, nebula-fast ]
    container:
      image: vesoft/nebula-dev:ubuntu2004
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.2
      - name: Link maven config file
        run: |
          ln -s /github/home/.m2/ /root/.m2
      - name: Build spark2.4 with Maven
        run: |
          mvn -B package -Dmaven.javadoc.skip=true -pl spark2.4 -am -Pscala-2.11 

  other-connector-spark:
    runs-on: [ self-hosted, nebula-fast ]
    container:
      image: vesoft/nebula-dev:ubuntu2004
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.2
      - name: Link maven config file
        run: |
          ln -s /github/home/.m2/ /root/.m2
      - name: Build spark3 with Maven
        run: |
          mvn -B package -Dmaven.javadoc.skip=true -pl spark3 -am -Pscala-2.12
